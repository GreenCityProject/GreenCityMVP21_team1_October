name: CI/CD GreenCity

on:
  pull_request:
    branches:
      - dev_java21

jobs:
  build:
    runs-on: centos-7
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'amazon-corretto'
          cache: maven
      - name: Set up Maven
        uses: s4u/setup-maven-action@v2
        with:
          maven-version: '3.9'
      - name: Build and test with Maven
        run:  mvn --version
#        run: mvn --batch-mode package -DskipTests -Dcheckstyle.skip